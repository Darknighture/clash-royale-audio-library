<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>皇室战争 音频库 · Clash Royale Audio Library</title>
<style>
:root{
  --bg:#fdf7f3; --ink:#2a1712; --ink2:#6b4438; --ink3:#a58273;
  --line:#f0ddd3; --card:#ffffff;
  --acc:#c8402a; --acc2:#9c2f1c; --acc-in:#8f2c1a; --acc-soft:#fdeee8; --acc-line:#f0c9ba;
  --gold:#e0a020; --red:#e0453a;
  --radius:14px;
  --shadow:0 1px 2px rgba(80,30,15,.05), 0 8px 24px -12px rgba(80,30,15,.20);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:linear-gradient(180deg,#fdf0e8 0%, var(--bg) 340px, var(--bg) 100%);
  color:var(--ink);
  font:15px/1.55 system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:74px;
}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1420px;margin:0 auto;padding:0 20px}
.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(135deg,#3d0f08 0%,#7e2110 45%,#c8402a 100%)}
.hero:before{content:"";position:absolute;inset:0;background:
  radial-gradient(700px 320px at 12% -10%,rgba(255,196,126,.32),transparent 60%),
  radial-gradient(600px 300px at 88% 0%,rgba(255,124,84,.24),transparent 60%)}
.hero .wrap{position:relative;padding:54px 20px 34px}
.chip-top{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);
  font-size:12.5px;letter-spacing:.14em;font-weight:600}
.chip-top b{color:#ffd15c;letter-spacing:.02em}
h1{margin:16px 0 8px;font-size:clamp(26px,4.4vw,44px);line-height:1.14;letter-spacing:-.02em}
h1 em{font-style:normal;background:linear-gradient(90deg,#ffd15c,#ffb03a);-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px;margin-top:28px}
.stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:26px;line-height:1.1;letter-spacing:-.02em}
.stat span{font-size:12px;color:rgba(255,255,255,.7)}
.stat.warn b{color:#ffcf5c}
.hint{margin-top:20px;font-size:12.5px;color:rgba(255,255,255,.55)}
.toolbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.86);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);box-shadow:0 6px 18px -16px rgba(90,30,15,.45)}
.toolbar .wrap{padding:11px 20px;display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.search{position:relative;flex:1 1 250px;min-width:210px}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:10px;
  background:#fff;font:inherit;font-size:14px;color:var(--ink);outline:none}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(200,64,42,.15)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.42}
select,.tgl{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;
  font:inherit;font-size:13.5px;color:var(--ink2);cursor:pointer;outline:none}
.tgl:hover{border-color:#e8c8bb}
.tgl.on{background:linear-gradient(180deg,#d1502f,#9c2f1c);border-color:#9c2f1c;color:#fff;font-weight:600}
.clear{background:none;border:none;color:var(--ink3);font:inherit;font-size:13px;cursor:pointer;padding:9px 4px}
.clear:hover{color:var(--red)}
.grp{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.grp .tgl{border:none;border-radius:0;font-size:13px;padding:9px 11px;white-space:nowrap}
.grp .tgl + .tgl{border-left:1px solid var(--line)}
.grp .tgl.on{font-weight:600}
.grp .tgl i{font-style:normal;font-size:11px;opacity:.55;margin-left:6px;
  font-variant-numeric:tabular-nums;letter-spacing:0}
.grp .tgl.on i{opacity:.88}
main{padding:20px 0 40px}
.bar{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:6px 0 14px;flex-wrap:wrap}
.bar .n{font-size:13.5px;color:var(--ink2)}
.bar .n b{color:var(--ink)}
.bar .tip{font-size:12.5px;color:var(--ink3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:13px}
@media(max-width:1080px){.grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;cursor:pointer;transition:transform .16s ease, box-shadow .16s ease, border-color .16s;
  display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#ecc9ba}
.card:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.card.playing{border-color:var(--acc);box-shadow:0 0 0 2px rgba(200,64,42,.20),var(--shadow)}
.card .stripe{height:3px;background:var(--hc,#a8968a)}
.thumb{position:relative;aspect-ratio:5/4;display:flex;align-items:flex-end;justify-content:center;
  background:radial-gradient(circle at 50% 30%,#fdf1ea,#f7e0d4);border-bottom:1px solid #f6e5da;
  overflow:hidden;padding:10px 8px 0}
.thumb img{height:92%;object-fit:contain;transition:transform .18s ease;
  filter:drop-shadow(0 5px 9px rgba(90,30,15,.20))}
.card:hover .thumb img{transform:scale(1.05)}
.thumb .none{align-self:center;color:#c0a294}
.thumb .glyph{align-self:center;width:52%;aspect-ratio:1;border-radius:14px;
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:34px;letter-spacing:.5px}
.badge{position:absolute;top:7px;right:7px;z-index:2;font-size:10.5px;font-weight:700;
  padding:2.5px 7px;border-radius:999px;background:var(--acc-soft);color:var(--acc2);border:1px solid var(--acc-line)}
.cbody{padding:9px 10px 10px;display:flex;flex-direction:column;gap:5px;flex:1}
.cname{font-size:13px;font-weight:650;line-height:1.3;letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.csub{font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmeta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:auto}
.fam{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--acc-soft);color:var(--acc-in);font-weight:600;
  white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.yr{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
.empty{padding:60px 0;text-align:center;color:var(--ink3)}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:22px}
.lb.open{display:flex}
.lb-bg{position:absolute;inset:0;background:rgba(45,12,6,.55);backdrop-filter:blur(4px)}
.lb-panel{position:relative;background:#fff;border-radius:18px;width:min(920px,100%);max-height:86vh;
  overflow:hidden;box-shadow:0 40px 90px -30px rgba(60,15,5,.50);
  display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr)}
@media(max-width:760px){.lb-panel{grid-template-columns:1fr;max-height:90vh;overflow:auto}}
.lb-vis{background:radial-gradient(circle at 50% 36%,#fdf2ec,#f7e2d8);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;padding:26px 20px;border-right:1px solid var(--line)}
.lb-vis img{max-height:min(38vh,290px);max-width:86%;object-fit:contain;
  filter:drop-shadow(0 8px 16px rgba(90,30,15,.22))}
.lb-vis .glyph{width:120px;height:120px;border-radius:22px;display:grid;place-items:center;
  color:#fff;font-weight:700;font-size:48px}
.lb-vis .none{color:#c0a294;text-align:center}
.lb-act{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;
  font-size:13px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#e8c8bb;background:#fdf6f2}
.btn.pri{background:linear-gradient(180deg,#d1502f,#9c2f1c);border-color:#9c2f1c;color:#fff}
.btn.pri:hover{background:linear-gradient(180deg,#e05c38,#b03520);color:#fff}
.lb-info{padding:20px 22px 0;min-width:0;display:flex;flex-direction:column;max-height:86vh}
@media(max-width:760px){.lb-info{max-height:none}}
.lb-info h2{margin:0 0 4px;font-size:22px;line-height:1.25;letter-spacing:-.02em;padding-right:112px}
.lb-sub{color:var(--ink3);font-size:13px;margin-bottom:14px;word-break:break-all}
.lb-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tg{font-size:11.5px;padding:3px 9px;border-radius:999px;background:#f7f0ea;color:var(--ink2);font-weight:600;
  white-space:nowrap}
.tg.g{background:var(--acc-soft);color:var(--acc2)}
.tg.b{background:#fdf4e3;color:#96631a}
.clips-head{font-size:12px;color:var(--ink3);padding:9px 0 6px;border-top:1px solid var(--line)}
.clips{overflow:auto;flex:1;padding-bottom:14px}
.clip{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:9px;font-size:13px}
.clip:hover{background:#fdf7f3}
.clip.on{background:var(--acc-soft)}
.clip .p{width:26px;height:26px;flex:none;border-radius:50%;border:1px solid var(--line);background:#fff;
  display:grid;place-items:center;color:var(--acc);font-size:10px;line-height:1}
.clip .p:hover{background:var(--acc);color:#fff;border-color:var(--acc)}
.clip.on .p{background:var(--acc);color:#fff;border-color:var(--acc)}
.clip .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;color:var(--ink2)}
.clip .du{flex:none;font-size:11.5px;color:var(--ink3);width:50px;text-align:right;font-variant-numeric:tabular-nums}
.clip .dl{flex:none;font-size:12px;color:var(--ink3);text-decoration:none;padding:3px 8px;border-radius:8px;
  border:1px solid var(--line);background:#fff}
.clip .dl:hover{color:var(--acc);border-color:var(--acc)}
.lb-nav{position:absolute;top:12px;right:14px;display:flex;gap:6px;z-index:3}
.lb-nav button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;
  color:var(--ink2);font-size:15px;line-height:1;display:grid;place-items:center}
.lb-nav button:hover{background:#fdf6f2;border-color:#e8c8bb}

/* ---------- player ---------- */
.player{position:fixed;left:0;right:0;bottom:0;z-index:80;background:rgba(255,255,255,.93);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);box-shadow:0 -6px 22px -14px rgba(90,30,15,.45)}
.player .wrap{padding:9px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.player .now{min-width:0;flex:1 1 200px}
.player .now .t1{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .now .t2{font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player audio{height:34px;flex:2 1 320px;min-width:210px}
.player .side{display:flex;gap:8px;align-items:center}
@media(max-width:640px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .lb-vis{padding:18px 14px}
}
</style>
</head>
<body>

<script>
/* ---- 中 / EN 语言切换（在页面主脚本之前加载）---- */
window.I18N = {
  "title":{"zh":"皇室战争 音频库 · Clash Royale Audio Library","en":"Clash Royale Audio Library"},
  "h1":{"zh":"皇室战争 <em>音频库</em>","en":"Clash Royale <em>Audio Library</em>"},
  "hint":{"zh":"↓ 向下滚动浏览 · 点卡片查看该单位全部音效 · 底部播放器可循环单曲","en":"↓ Scroll to browse · click a card to see all its clips · loop a single track in the bottom player"},
  "search":{"zh":"搜索名称 / 音效名…","en":"Search name / clip name…"},
  "catAll":{"zh":"全部分类","en":"All categories"},
  "kind_bgm":{"zh":"背景音乐","en":"BGM"},
  "kind_sfx":{"zh":"单位音效","en":"SFX"},
  "rarAll":{"zh":"全部稀有度","en":"All rarities"},
  "sortDefault":{"zh":"默认顺序","en":"Default order"},
  "sortName":{"zh":"名称 A → Z","en":"Name A → Z"},
  "sortCount":{"zh":"音效数 ↓","en":"Most clips"},
  "reset":{"zh":"重置","en":"Reset"},
  "tipNote":{"zh":"音频收录截止到2026年09。","en":"Audio collected up to September 2026."},
  "empty":{"zh":"没有符合条件的条目，试试放宽筛选条件。","en":"Nothing matches — try loosening the filters."},
  "countItems":{"zh":"共 <b>{1}</b> 个条目 / 全部 {2} 个 · <b>{3}</b> 段音频","en":"<b>{1}</b> of {2} entries · <b>{3}</b> clips"},
  "stClips":{"zh":"音频片段","en":"Clips"},
  "stPacks":{"zh":"音频包","en":"Sound banks"},
  "stIcons":{"zh":"卡图","en":"Card art"},
  "stRaw":{"zh":"原始 wav","en":"Raw wav"},
  "playAll":{"zh":"▶ 播放全部","en":"▶ Play all"},
  "dlAll":{"zh":"⤓ 下载全部","en":"⤓ Download all"},
  "clipsHead":{"zh":"{1} 段音效 · 共 {2} 秒","en":"{1} clips · {2}s total"},
  "notPlaying":{"zh":"未选择音频","en":"Nothing playing"},
  "notPlayingSub":{"zh":"点任意片段左侧的 ▶ 开始试听","en":"Click ▶ next to any clip to preview"},
  "loop":{"zh":"单曲循环","en":"Loop"},
  "dl":{"zh":"⤓ 下载","en":"⤓ Download"},
  "prev":{"zh":"上一个 (←)","en":"Previous (←)"},
  "next":{"zh":"下一个 (→)","en":"Next (→)"},
  "close":{"zh":"关闭 (Esc)","en":"Close (Esc)"},
  "cat_cards":{"zh":"卡牌单位","en":"Cards"},
  "cat_merge":{"zh":"合合奇兵","en":"Merge Tactics"},
  "cat_ruler":{"zh":"统帅","en":"Rulers"},
  "cat_tower":{"zh":"塔楼","en":"Towers"},
  "cat_bgm":{"zh":"背景音乐","en":"Background Music"},
  "rar_common":{"zh":"普通","en":"Common"},
  "rar_rare":{"zh":"稀有","en":"Rare"},
  "rar_epic":{"zh":"史诗","en":"Epic"},
  "rar_legendary":{"zh":"传奇","en":"Legendary"},
  "rar_champion":{"zh":"英雄","en":"Champion"},
  "rar_evolution":{"zh":"进化","en":"Evolution"},
  "rar_hero":{"zh":"英雄形态","en":"Hero"},
  "rar_tower":{"zh":"塔楼部队","en":"Tower Troop"},
  "tag_部署":{"zh":"部署","en":"Deploy"},
  "tag_攻击":{"zh":"攻击","en":"Attack"},
  "tag_阵亡":{"zh":"阵亡","en":"Death"},
  "tag_受击":{"zh":"受击","en":"Hit"},
  "tag_移动":{"zh":"移动","en":"Move"},
  "tag_语音":{"zh":"语音","en":"Voice"},
  "tag_技能":{"zh":"技能","en":"Ability"},
  "tag_循环":{"zh":"循环","en":"Loop"},
  "tag_音乐":{"zh":"音乐","en":"Music"},
  "tag_其他":{"zh":"其他","en":"Other"},
};
window.LANG = (function(){ try{ return localStorage.getItem('cr-audio-lang')==='en'?'en':'zh'; }catch(e){ return 'zh'; } })();
window.T = function(k){
  var e = window.I18N[k]; if(!e) return k;
  var s = (window.LANG === 'en' && e.en) ? e.en : e.zh;
  if(s == null) s = '';
  for(var i = 1; i < arguments.length; i++){ s = s.split('{' + i + '}').join(arguments[i]); }
  return s;
};
function applyI18n(){
  document.title = T('title');
  document.documentElement.lang = window.LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = T(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-html]').forEach(function(el){ el.innerHTML = T(el.getAttribute('data-i18n-html')); });
  document.querySelectorAll('[data-i18n-ph]').forEach(function(el){ el.setAttribute('placeholder', T(el.getAttribute('data-i18n-ph'))); });
  document.querySelectorAll('[data-i18n-title]').forEach(function(el){ el.setAttribute('title', T(el.getAttribute('data-i18n-title'))); });
  var z = document.getElementById('l-zh'), e2 = document.getElementById('l-en');
  if(z) z.classList.toggle('on', window.LANG !== 'en');
  if(e2) e2.classList.toggle('on', window.LANG === 'en');
  if(typeof buildCatOptions === 'function') buildCatOptions();
  if(typeof render === 'function') render();
}
function setLang(l){
  window.LANG = l;
  try{ localStorage.setItem('cr-audio-lang', l); }catch(e){}
  var lbEl = document.getElementById('lb');
  var wasOpen = lbEl && lbEl.classList.contains('open');
  applyI18n();
  if(wasOpen){ try{ if(cur >= 0) openBy(cur); }catch(e){} }
}
document.addEventListener('DOMContentLoaded', function(){
  var z = document.getElementById('l-zh'), e2 = document.getElementById('l-en');
  if(z) z.addEventListener('click', function(){ setLang('zh'); });
  if(e2) e2.addEventListener('click', function(){ setLang('en'); });
  applyI18n();
});
</script>

<header class="hero">
  <div class="wrap">
    <div class="chip-top">CLASH ROYALE · <b>AUDIO LIBRARY</b></div>
    <h1 data-i18n-html="h1">皇室战争 <em>音频库</em></h1>
    <div class="stats" id="stats"></div>
    <div class="hint" data-i18n="hint"></div>
  </div>
</header>

<nav class="toolbar">
  <div class="wrap">
    <label class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#2a1712" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input id="q" type="search" data-i18n-ph="search" placeholder="搜索名称 / 音效名…" autocomplete="off">
    </label>
    <select id="cat"></select>
    <div class="grp" id="kind" role="group"></div>
    <select id="rar"></select>
    <select id="sort">
      <option value="idx" data-i18n="sortDefault">默认顺序</option>
      <option value="name" data-i18n="sortName">名称 A → Z</option>
      <option value="count" data-i18n="sortCount">音效数 ↓</option>
    </select>
    <div class="grp" role="group"><button class="tgl" id="l-zh" title="中文">中</button><button class="tgl" id="l-en" title="English">EN</button></div>
    <button class="clear" id="reset" data-i18n="reset">重置</button>
  </div>
</nav>

<main class="wrap">
  <div class="bar">
    <div class="n" id="count"></div>
    <div class="tip" data-i18n="tipNote"></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" data-i18n="empty" style="display:none"></div>
</main>


<div class="lb" id="lb">
  <div class="lb-bg" data-close></div>
  <div class="lb-panel" role="dialog" aria-modal="true">
    <div class="lb-nav">
      <button id="prev" data-i18n-title="prev" title="上一个 (←)">‹</button>
      <button id="next" data-i18n-title="next" title="下一个 (→)">›</button>
      <button data-close data-i18n-title="close" title="关闭 (Esc)">✕</button>
    </div>
    <div class="lb-vis" id="lb-vis"></div>
    <div class="lb-info" id="lb-info"></div>

  <div class="wrap">
    <div class="now">
      <div class="t1" id="p-title"></div>
      <div class="t2" id="p-sub"></div>
    </div>
    <audio id="player" controls preload="none"></audio>
    <div class="side">
      <button class="tgl" id="loop" data-i18n="loop">单曲循环</button>
      <a class="btn" id="p-dl" href="#" download data-i18n="dl">⤓ 下载</a>
    </div>
  </div>

:"audio/bgm_legacy/Forest_Gang_Lobby_Music.mp3","t":"音乐","k":"bgm","d":97.7},{"n":"Metal Season Battle Music_v2_A","f":"audio/bgm_legacy/Metal Season Battle Music_v2_A.mp3","t":"音乐","k":"bgm","d":121.98},{"n":"Metal Season Battle Music_v2_B","f":"audio/bgm_legacy/Metal Season Battle Music_v2_B.mp3","t":"音乐","k":"bgm","d":30.0},{"n":"Metal Season Battle Music_v2_C","f":"audio/bgm_legacy/Metal Season Battle Music_v2_C.mp3","t":"音乐","k":"bgm","d":30.0},{"n":"Metal Season Battle Music_v2_D","f":"audio/bgm_legacy/Metal Season Battle Music_v2_D.mp3","t":"音乐","k":"bgm","d":132.48},{"n":"Metal Season Lobby Music_v1","f":"audio/bgm_legacy/Metal Season Lobby Music_v1.mp3","t":"音乐","k":"bgm","d":97.24},{"n":"menu_03","f":"audio/bgm_legacy/menu_03.mp3","t":"音乐","k":"bgm","d":96.0},{"n":"music_arena_evo_baby_dragon","f":"audio/bgm_legacy/music_arena_evo_baby_dragon.mp3","t":"音乐","k":"bgm","d":125.78},{"n":"music_arena_furnace_battle_4_4_bpm_90","f":"audio/bgm_legacy/music_arena_furnace_battle_4_4_bpm_90.mp3","t":"音乐","k":"bgm","d":85.33},{"n":"music_lobby_evo_baby_dragon","f":"audio/bgm_legacy/music_lobby_evo_baby_dragon.mp3","t":"音乐","k":"bgm","d":102.72},{"n":"music_lobby_inferno_dragon","f":"audio/bgm_legacy/music_lobby_inferno_dragon.mp3","t":"音乐","k":"bgm","d":96.72},{"n":"music_lobby_inferno_dragon_slow","f":"audio/bgm_legacy/music_lobby_inferno_dragon_slow.mp3","t":"音乐","k":"bgm","d":70.41},{"n":"music_lobby_undead","f":"audio/bgm_legacy/music_lobby_undead.mp3","t":"音乐","k":"bgm","d":103.5},{"n":"music_lobby_undead_amb","f":"audio/bgm_legacy/music_lobby_undead_amb.mp3","t":"音乐","k":"bgm","d":22.31},{"n":"new_menu_01","f":"audio/bgm_legacy/new_menu_01.mp3","t":"音乐","k":"bgm","d":96.0},{"n":"wizmen04","f":"audio/bgm_legacy/wizmen04.mp3","t":"音乐","k":"bgm","d":96.0}]}],"cats":[{"id":"cards","n":189},{"id":"merge","n":46},{"id":"ruler","n":31},{"id":"tower","n":6},{"id":"bgm","n":23}],"rarCount":{"common":29,"rare":31,"epic":33,"legendary":25,"champion":8,"evolution":46,"hero":17,"tower":0},"kindCount":{"bgm":104,"sfx":2146},"stats":{"packs":295,"clips":2250,"icons":184,"raw":2569}};

const ITEMS = window.DATA.items;
const IDX = new Map(ITEMS.map((x,i)=>[x,i]));
let VIEW = [], cur = -1;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const nameOf = x => window.LANG === 'en' ? (x.en || x.zh) : (x.zh || x.en);
const subOf  = x => window.LANG === 'en' ? (x.zh || '') : (x.en || '');
const catName = x => T('cat_' + x.cat);
const rarName = x => x.rar ? T('rar_' + x.rar) : catName(x);
const tagName = t => T('tag_' + t);

/* ---------------- hero 统计 ---------------- */
(function(){
  const s = window.DATA.stats;
  const S = [[s.clips, T('stClips')], [s.packs, T('stPacks')], [s.icons, T('stIcons')], [s.raw, T('stRaw')]];
  document.getElementById('stats').innerHTML = S.map(([v,l],i) =>
    `<div class="stat${i===0?' warn':''}"><b>${v.toLocaleString()}</b><span>${esc(l)}</span></div>`).join('');
})();

/* ---------------- 筛选器 ---------------- */
const S = {q:"", cat:"", kind:"", rar:"", sort:"idx"};
const CATS = window.DATA.cats.slice();
const RARS = ['common','rare','epic','legendary','champion','evolution','hero','tower'];
const KINDS = ['bgm','sfx'];
const catSel = document.getElementById('cat'), rarSel = document.getElementById('rar'),
      kindBox = document.getElementById('kind');

/* 音频类别：按钮组（背景音乐 / 单位音效），比下拉更直观。
   没有「全部」按钮 —— 再点一次已选中的按钮即取消，回到不过滤。 */
function syncKind(){
  kindBox.querySelectorAll('.tgl').forEach(b => {
    const on = b.dataset.k === S.kind;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
}
function buildCatOptions(){
  const c = catSel.value, r = rarSel.value;
  catSel.innerHTML = '<option value="">'+esc(T('catAll'))+'</option>' +
    CATS.map(x=>`<option value="${esc(x.id)}">${esc(T('cat_'+x.id))} (${x.n})</option>`).join('');
  kindBox.innerHTML = KINDS.filter(x=>window.DATA.kindCount[x])
    .map(x=>`<button class="tgl" type="button" data-k="${x}">${esc(T('kind_'+x))}<i>${window.DATA.kindCount[x].toLocaleString()}</i></button>`).join('');
  rarSel.innerHTML = '<option value="">'+esc(T('rarAll'))+'</option>' +
    RARS.filter(x=>window.DATA.rarCount[x]).map(x=>`<option value="${x}">${esc(T('rar_'+x))} (${window.DATA.rarCount[x]})</option>`).join('');
  catSel.value = c; rarSel.value = r;
  syncKind();
}
buildCatOptions();
/* 当前生效的「音频类别」下，该条目实际要展示的片段 */
const clipsOf = x => S.kind ? x.clips.filter(c => c.k === S.kind) : x.clips;
function match(x){
  if(S.cat && x.cat !== S.cat) return false;
  if(S.kind && !x.clips.some(c => c.k === S.kind)) return false;
  if(S.rar && x.rar !== S.rar) return false;
  if(S.q){
    const hay = (x.zh+" "+x.en+" "+x.id+" "+catName(x)+" "+(x.rar||"")+" "+
                 x.clips.map(c=>c.n).join(" ")).toLowerCase();
    if(!S.q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>hay.includes(w))) return false;
  }
  return true;
}
function sortList(a,b){
  if(S.sort === "name") return nameOf(a).localeCompare(nameOf(b));
  if(S.sort === "count") return clipsOf(b).length - clipsOf(a).length;
  return IDX.get(a) - IDX.get(b);
}

/* ---------------- 网格 ---------------- */
const grid = document.getElementById('grid'), countEl = document.getElementById('count'), emptyEl = document.getElementById('empty');

function thumb(x){
  if(x.icon) return `<img loading="lazy" decoding="async" src="${esc(x.icon)}" alt="${esc(nameOf(x))}">`;
  if(x.cat === 'bgm')
    return `<div class="none"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#c0a294" stroke-width="1.5"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.6"/><circle cx="16.5" cy="16" r="2.6"/></svg></div>`;
  const initial = (nameOf(x)||'?').replace(/[^\u4e00-\u9fa5A-Za-z0-9]/g,'').charAt(0) || '?';
  return `<div class="glyph" style="background:${x.color}">${esc(initial.toUpperCase())}</div>`;
}

function card(x){
  return `<article class="card" tabindex="0" data-i="${IDX.get(x)}" title="${esc(nameOf(x))}">
    <div class="stripe" style="--hc:${x.color}"></div>
    <div class="thumb">
      <div class="badge">${clipsOf(x).length}</div>
      ${thumb(x)}
    </div>
    <div class="cbody">
      <div class="cname">${esc(nameOf(x))}</div>
      <div class="csub">${esc(subOf(x))}</div>
      <div class="cmeta">
        <span class="fam" style="background:${x.color}22;color:${x.color}">${esc(rarName(x))}</span>
        <span class="yr">${clipsOf(x).length} ${window.LANG==='en'?'clips':'段'}</span>
      </div>
    </div>
  </article>`;
}

function render(){
  VIEW = ITEMS.filter(match).sort(sortList);
  const total = VIEW.reduce((a,x)=>a+clipsOf(x).length,0);
  countEl.innerHTML = T('countItems', VIEW.length, ITEMS.length, total.toLocaleString());
  emptyEl.style.display = VIEW.length ? "none" : "block";
  grid.innerHTML = VIEW.map(card).join('');
  markPlaying();
}

grid.addEventListener('click', ev => {
  const c = ev.target.closest('.card'); if(!c) return;
  openBy(VIEW.findIndex(x => IDX.get(x) === +c.dataset.i));
});
grid.addEventListener('keydown', ev => {
  if(ev.key !== "Enter" && ev.key !== " ") return;
  const c = ev.target.closest('.card'); if(!c) return;
  ev.preventDefault();
  openBy(VIEW.findIndex(x => IDX.get(x) === +c.dataset.i));
});

/* ---------------- 弹层 ---------------- */
const lb = document.getElementById('lb'), player = document.getElementById('player');
let playingFile = '';

function openBy(i){
  if(i < 0 || i >= VIEW.length) return;
  cur = i; const x = VIEW[i];
  const cs = clipsOf(x);          // 只展示当前「音频类别」下的片段
  const initial = (nameOf(x)||'?').replace(/[^\u4e00-\u9fa5A-Za-z0-9]/g,'').charAt(0) || '?';
  const vis = x.icon ? `<img src="${esc(x.icon)}" alt="${esc(nameOf(x))}">`
    : (x.cat === 'bgm'
        ? `<div class="none"><svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#c0a294" stroke-width="1.4"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.6"/><circle cx="16.5" cy="16" r="2.6"/></svg></div>`
        : `<div class="glyph" style="background:${x.color}">${esc(initial.toUpperCase())}</div>`);
  document.getElementById('lb-vis').innerHTML = vis + `<div class="lb-act">
      <button class="btn pri" id="lb-play">${esc(T('playAll'))}</button>
      <button class="btn" id="lb-dl">${esc(T('dlAll'))}</button>
    </div>`;
  document.getElementById('lb-play').onclick = () => { if(cs.length) play(cs[0], x); };
  document.getElementById('lb-dl').onclick = () => downloadAll(cs);

  const secs = cs.reduce((a,c)=>a+c.d, 0);
  const tgs = [`<span class="tg">${esc(catName(x))}</span>`];
  if(x.rar) tgs.push(`<span class="tg g">${esc(rarName(x))}</span>`);
  tgs.push(`<span class="tg b">${cs.length} ${window.LANG==='en'?'clips':'段'}</span>`);

  document.getElementById('lb-info').innerHTML = `
    <h2>${esc(nameOf(x))}</h2>
    <div class="lb-sub">${esc(subOf(x))}${subOf(x)?' · ':''}${esc(x.id)}</div>
    <div class="lb-tags">${tgs.join('')}</div>
    <div class="clips-head">${esc(T('clipsHead', cs.length, secs.toFixed(1)))}</div>
    <div class="clips" id="lb-clips"></div>`;
  const box = document.getElementById('lb-clips');
  box.innerHTML = cs.map((c,i) => `<div class="clip" data-f="${esc(c.f)}">
      <button class="p" data-i="${i}">▶</button>
      <span class="nm" title="${esc(c.n)}">${esc(c.n)}</span>
      <span class="tg">${esc(tagName(c.t))}</span>
      <span class="du">${c.d.toFixed(2)}s</span>
      <a class="dl" href="${esc(c.f)}" download="${esc(c.n)}.mp3">⤓</a>
    </div>`).join('');
  box.querySelectorAll('.clip').forEach(row => {
    row.querySelector('.p').onclick = () => play(cs[+row.querySelector('.p').dataset.i], x);
  });

  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
  markPlaying();
}
function close(){ lb.classList.remove('open'); document.body.style.overflow = ''; }
lb.addEventListener('click', ev => { if(ev.target.hasAttribute('data-close')) close(); });
document.getElementById('prev').onclick = () => openBy(cur-1);
document.getElementById('next').onclick = () => openBy(cur+1);
document.addEventListener('keydown', ev => {
  if(!lb.classList.contains('open')) return;
  if(ev.key === "Escape") close();
  if(ev.key === "ArrowLeft") openBy(cur-1);
  if(ev.key === "ArrowRight") openBy(cur+1);
});

/* ---------------- 播放 ---------------- */
function play(clip, item){
  player.src = clip.f;
  player.play().catch(()=>{});
  playingFile = clip.f;
  $('#p-title').textContent = clip.n;
  $('#p-sub').textContent = nameOf(item) + ' · ' + catName(item);
  const dl = $('#p-dl'); dl.href = clip.f; dl.download = clip.n + '.mp3';
  markPlaying();
}
function markPlaying(){
  document.querySelectorAll('.clip.on').forEach(n => n.classList.remove('on'));
  const row = document.querySelector('.clip[data-f="' + playingFile.replace(/["\\]/g,'') + '"]');
  if(row) row.classList.add('on');
  document.querySelectorAll('.card.playing').forEach(n => n.classList.remove('playing'));
  const item = ITEMS.find(x => x.clips.some(c => c.f === playingFile));
  if(item){
    const el = grid.querySelector('.card[data-i="' + IDX.get(item) + '"]');
    if(el) el.classList.add('playing');
  }
}
function downloadAll(clips){
  clips.forEach((c,i) => setTimeout(() => {
    const a = document.createElement('a');
    a.href = c.f; a.download = c.n + '.mp3';
    document.body.appendChild(a); a.click(); a.remove();
  }, i*260));
}
$('#loop').onclick = ev => { player.loop = !player.loop; ev.currentTarget.classList.toggle('on', player.loop); };

/* ---------------- 工具栏 ---------------- */
let timer;
$('#q').addEventListener('input', ev => {
  clearTimeout(timer); const v = ev.target.value;
  timer = setTimeout(() => { S.q = v.trim(); render(); }, 120);
});
catSel.onchange = ev => { S.cat = ev.target.value; render(); };
kindBox.onclick = ev => {
  const b = ev.target.closest('.tgl');
  if(!b) return;
  const k = b.dataset.k;            // 再点一次已选中的按钮 → 取消筛选
  S.kind = (S.kind === k) ? "" : k;
  syncKind();
  render();
};
rarSel.onchange = ev => { S.rar = ev.target.value; render(); };
$('#sort').onchange = ev => { S.sort = ev.target.value; render(); };
$('#reset').onclick = () => {
  S.q=""; S.cat=""; S.kind=""; S.rar=""; S.sort="idx";
  $('#q').value=""; catSel.value=""; rarSel.value=""; $('#sort').value="idx";
  syncKind();
  render();
};

$('#p-title').textContent = T('notPlaying');
$('#p-sub').textContent = T('notPlayingSub');
render();
</script>
